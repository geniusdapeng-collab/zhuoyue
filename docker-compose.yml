# ============================================================
# Commercial Ad Skill Orchestrator — Docker Compose
# P6: 生产部署编排
# ============================================================

version: "3.9"

services:
  # ---- Skill 编排器主服务 ----
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: commercial-ad-skill-orchestrator:${VERSION:-latest}
    container_name: skill-orchestrator
    restart: unless-stopped

    # 端口映射：HTTP 健康检查/指标
    ports:
      - "${EVENT_BUS_PORT:-3000}:3000"

    # 环境变量注入（开发/测试/生产分离）
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - EVENT_BUS_PORT=${EVENT_BUS_PORT:-3000}
      - MAX_PIPELINE_CONCURRENCY=${MAX_PIPELINE_CONCURRENCY:-3}
      - SKILL_TIMEOUT_MS=${SKILL_TIMEOUT_MS:-30000}
      - ENABLE_COMPENSATION=${ENABLE_COMPENSATION:-true}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - METRICS_RETENTION_HOURS=${METRICS_RETENTION_HOURS:-24}

    # 资源限制（防止容器吞掉整台机器）
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M

    # 持久化：日志和输出目录
    volumes:
      - orchestrator-logs:/app/logs
      - orchestrator-output:/app/tmp-output

    # 健康检查（与 Dockerfile 中的 HEALTHCHECK 配合）
    healthcheck:
      test: ["CMD", "node", "deploy/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - skill-network

  # ---- 可选：Prometheus 指标收集（仅生产环境启用） ----
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: skill-prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus
  #   networks:
  #     - skill-network

# ---- 命名卷 ----
volumes:
  orchestrator-logs:
    driver: local
  orchestrator-output:
    driver: local
  # prometheus-data:
  #   driver: local

# ---- 网络 ----
networks:
  skill-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
